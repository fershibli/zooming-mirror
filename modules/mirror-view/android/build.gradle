plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mirrorview'
version = '0.1.0'

android {
  namespace "expo.modules.mirrorview"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  def camerax_version = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  // CameraX's controls return Guava's ListenableFuture, which reaches the APK
  // through CameraX itself (media3 pulls in full Guava, and listenablefuture
  // resolves to an empty stub next to it). Compile-only: nothing new ships.
  compileOnly "com.google.guava:guava:33.3.1-android"
}
